name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24.15.0
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run typecheck
      - run: vp test
      - run: vp pm audit -- --prod --audit-level high
      - run: mkdir -p .artifacts && vp pm pack --pack-destination .artifacts
      - run: npm install --prefix test/fixtures/consumer --include=dev --no-package-lock --no-save .artifacts/*.tgz
      - run: npm --prefix test/fixtures/consumer run typecheck
      - run: npm --prefix test/fixtures/consumer run build

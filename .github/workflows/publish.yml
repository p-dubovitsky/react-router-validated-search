name: Publish npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run typecheck
      - run: vp test
      - run: vp pm publish -- --provenance --access public
        env:
          # Required only for the first release. Once npm Trusted Publishing is
          # configured, npm uses this job's OIDC token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
